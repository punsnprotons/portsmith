name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run demo
      - run: npm run demo:browser
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .portsmith/alpha-release-*/proof.json
            .portsmith/alpha-release-*/audit.json
            .portsmith/alpha-release-*/*.log
          retention-days: 14
