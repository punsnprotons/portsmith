name: Feature request
description: Explain a workflow Portsmith should support.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to accomplish?
      description: Describe the feature transfer and where the current workflow stops you.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful result look like?
      description: A concrete example helps more than a general request for broader support.
    validations:
      required: true
